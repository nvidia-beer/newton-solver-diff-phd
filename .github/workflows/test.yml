name: CPU checks
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: solver
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: solver
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.6"
      - run: uv sync --locked --extra examples
      - run: python3 tools/build_readme.py --check
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked python -m unittest discover -s tests -v
      - run: uv run --locked python -m tests.material_fit_demo --device cpu
      - run: uv run --locked python -m tests.demo_drop --device cpu --viewer null --num-frames 120 --test
      - run: uv build
